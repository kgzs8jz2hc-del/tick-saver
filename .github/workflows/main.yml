name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: tick-saver-windows
          path: ${{ steps.build.outputs.build-output }}
